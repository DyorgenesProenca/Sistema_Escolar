<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f7fafc; padding: 30px; }
        .header { background: linear-gradient(135deg, #d69e2e 0%, #b7791f 100%); color: white; padding: 25px; border-radius: 15px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .container { display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { color: #2d3748; margin-bottom: 20px; font-size: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; color: #4a5568; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 15px; }
        button { width: 100%; padding: 12px; background: #3182ce; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #2b6cb0; }
        .logout-btn { background: #e53e3e; width: auto; padding: 8px 15px; }
        .logout-btn:hover { background: #c53030; }
        
        /* Estilos da tabela de alunos */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #edf2f7; color: #4a5568; }
        .nota-input { width: 60px; padding: 5px; text-align: center; }
        .save-grade-btn { padding: 6px 12px; background: #38a169; font-size: 13px; }
        .save-grade-btn:hover { background: #2f855a; }
        .badge { padding: 4px 8px; border-radius: 20px; font-size: 12px; font-weight: bold; color: white; }
        .Aprovado { background: #48bb78; }
        .Reprovado { background: #f56565; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1 id="welcomeText">Mestre da Matemática</h1>
            <p>Painel de Gerenciamento Escolar</p>
        </div>
        <button class="logout-btn" onclick="logout()">Sair</button>
    </div>

    <div class="container">
        <!-- Esquerda: Cadastrar Novo Aluno/Professor -->
        <div class="card">
            <h2>📝 Cadastrar Novo Usuário</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="regName" required>
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="regEmail" required>
                </div>
                <div class="form-group">
                    <label>Senha de Acesso</label>
                    <input type="password" id="regPassword" required>
                </div>
                <div class="form-group">
                    <label>Tipo de Conta (Role)</label>
                    <select id="regRole">
                        <option value="aluno">Aluno</option>
                        <option value="professor">Professor</option>
                    </select>
                </div>
                <button type="submit">Finalizar Cadastro</button>
            </form>
        </div>

        <!-- Direita: Listagem e Lançamento de Notas -->
        <div class="card">
            <h2>📊 Diário de Classe & Notas</h2>
            <table>
                <thead>
                    <tr>
                        <th>Aluno</th>
                        <th>N1</th>
                        <th>N2</th>
                        <th>N3</th>
                        <th>N4</th>
                        <th>Média</th>
                        <th>Status</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="gradesTableBody">
                    <!-- Gerado dinamicamente via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Restringe acesso de quem não está logado como professor
const user = JSON.parse(localStorage.getItem('loggedUser'));
if (!user || user.role !== 'professor') { window.location.href = 'login.html'; }
document.getElementById('welcomeText').textContent = `Olá, Prof. ${user.name}! 👨‍🏫`;

function logout() { localStorage.clear(); window.location.href = 'login.html'; }

// Carregar a lista de alunos com notas e botões de ação
async function loadGrades() {
    const response = await fetch('http://localhost:3000/grades');
    const data = await response.json();
    const tbody = document.getElementById('gradesTableBody');
    tbody.innerHTML = '';

    data.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>
                <strong id="name-text-${item.id}">${item.name}</strong><br>
                <small id="email-text-${item.id}" style="color:#718096">${item.email}</small>
                <div style="margin-top: 8px; display: flex; gap: 5px;">
                    <!-- Botões corrigidos sem misturar texto -->
                    <button type="button" style="padding: 4px 8px; font-size: 11px; background: #4a5568; width: auto; cursor: pointer; color: white;" onclick="editUser(${item.id})">Editar Cadastro</button>
                    <button type="button" style="padding: 4px 8px; font-size: 11px; background: #e53e3e; width: auto; cursor: pointer; color: white;" onclick="deleteUser(${item.id}, '${item.name}')">Excluir</button>
                </div>
            </td>
            <td><input type="number" step="0.1" class="nota-input" id="n1-${item.id}" value="${item.nota1}"></td>
            <td><input type="number" step="0.1" class="nota-input" id="n2-${item.id}" value="${item.nota2}"></td>
            <td><input type="number" step="0.1" class="nota-input" id="n3-${item.id}" value="${item.nota3}"></td>
            <td><input type="number" step="0.1" class="nota-input" id="n4-${item.id}" value="${item.nota4}"></td>
            <td><strong>${Number(item.media).toFixed(1)}</strong></td>
            <td><span class="badge ${item.status}">${item.status}</span></td>
            <td><button class="save-grade-btn" onclick="saveGrades(${item.id})">Salvar Notas</button></td>
        `;
        tbody.appendChild(tr);
    });
}


// Função para o Professor EDITAR Nome e E-mail do Aluno
async function editUser(id) {
    try {
        // Pega o texto atual que está renderizado na linha da tabela
        const currentName = document.getElementById(`name-text-${id}`).textContent;
        const currentEmail = document.getElementById(`email-text-${id}`).textContent;

        // Abre os prompts na tela do navegador solicitando os novos dados
        const newName = prompt("Digite o novo nome do aluno:", currentName);
        if (newName === null) return; // Se clicar em cancelar, interrompe a função

        const newEmail = prompt("Digite o novo e-mail do aluno:", currentEmail);
        if (newEmail === null) return; // Se clicar em cancelar, interrompe a função

        // Faz a requisição PUT para a rota do seu backend Node.js
        const response = await fetch(`http://localhost:3000/users/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: newName, email: newEmail })
        });

        if (response.ok) {
            alert('Cadastro do aluno atualizado com sucesso!');
            loadGrades(); // Recarrega a tabela na tela com os nomes novos
        } else {
            const err = await response.json();
            alert(err.error || 'Erro ao atualizar cadastro.');
        }
    } catch (error) {
        console.error("Erro ao tentar editar usuário:", error);
        alert("Não foi possível conectar ao servidor.");
    }
}


// Função para o Professor EXCLUIR um Aluno do sistema
async function deleteUser(id, name) {
    if (confirm(`Tem certeza absoluta que deseja excluir o aluno "${name}"? Todas as notas dele serão apagadas!`)) {
        const response = await fetch(`http://localhost:3000/users/${id}`, {
            method: 'DELETE'
        });

        if (response.ok) {
            alert('Aluno excluído com sucesso!');
            loadGrades(); // Atualiza a lista na tela
        } else {
            alert('Erro ao excluir o aluno.');
        }
    }
}

// Lançar as notas editadas
async function saveGrades(studentId) {
    const nota1 = document.getElementById(`n1-${studentId}`).value;
    const nota2 = document.getElementById(`n2-${studentId}`).value;
    const nota3 = document.getElementById(`n3-${studentId}`).value;
    const nota4 = document.getElementById(`n4-${studentId}`).value;

    const response = await fetch(`http://localhost:3000/grades/${studentId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nota1, nota2, nota3, nota4 })
    });

    if (response.ok) { alert('Boletim atualizado!'); loadGrades(); }
    else { alert('Erro ao salvar notas.'); }
}

// Cadastro de novos usuários
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('regName').value;
    const email = document.getElementById('regEmail').value;
    const password = document.getElementById('regPassword').value;
    const role = document.getElementById('regRole').value;

    const response = await fetch('http://localhost:3000/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, role })
    });

    if (response.ok) {
        alert('Cadastrado com sucesso!');
        document.getElementById('registerForm').reset();
        loadGrades();
    } else {
        const err = await response.json();
        alert(err.error);
    }
});

loadGrades();

    </script>
</body>
</html>
