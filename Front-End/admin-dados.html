<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Master Admin - Controle Escolar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', monospace; }
        body { background: #1a202c; color: #a0aec0; padding: 30px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #4a5568; padding-bottom: 15px; margin-bottom: 30px; }
        h1 { color: #ecc94b; font-size: 24px; }
        .grid-layout { display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }
        .container { background: #2d3748; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        h2 { color: #63b3ed; font-size: 18px; margin-bottom: 15px; border-left: 4px solid #63b3ed; padding-left: 8px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-size: 12px; color: #cbd5e0; }
        input, select { width: 100%; padding: 10px; background: #1a202c; border: 1px solid #4a5568; color: white; border-radius: 6px; }
        .action-btn { width: 100%; padding: 12px; background: #3182ce; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .action-btn:hover { background: #2b6cb0; }
        table { width: 100%; border-collapse: collapse; background: #232d3f; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #4a5568; }
        th { background: #4a5568; color: white; }
        .btn-small { padding: 4px 8px; font-size: 11px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; margin-right: 5px; }
        .edit-btn { background: #ecc94b; color: #1a202c; }
        .delete-btn { background: #e53e3e; }
        .nav-link { background: #e53e3e; color: white; text-decoration: none; padding: 10px 15px; border-radius: 6px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1 id="adminTitle">🖥️ MASTER_ROOT_ADMIN Panel</h1>
        <button class="nav-link" onclick="logout()">Sair do Sistema</button>
    </div>

    <div class="grid-layout">
        <!-- Esquerda: Cadastro Global (Qualquer tipo de conta) -->
        <div class="container">
            <h2>Gestão: Criar Nova Conta</h2>
            <form id="adminRegisterForm">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>E-mail de Acesso</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Senha Provisória</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <label>Nível de Permissão (Nível)</label>
                    <select id="role">
                        <option value="aluno">Aluno</option>
                        <option value="professor">Professor</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <button type="submit" class="action-btn">Salvar Usuário</button>
            </form>
        </div>

        <!-- Direita: Auditoria, Edição e Deleção Global -->
        <div class="container">
            <h2>Controle Geral: Base de Dados [users]</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Nível</th>
                        <th>Ações Globais</th>
                    </tr>
                </thead>
                <tbody id="adminUsersTable">
                    <!-- Inserido dinamicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Bloqueia acesso se não for administrador logado
        const loggedUser = JSON.parse(localStorage.getItem('loggedUser'));
        if (!loggedUser || loggedUser.role !== 'admin') { window.location.href = 'login.html'; }
        document.getElementById('adminTitle').textContent = `🖥️ Painel Admin: ${loggedUser.name}`;

        function logout() { localStorage.clear(); window.location.href = 'login.html'; }

        // Listar todos do sistema
        async function loadAllUsersSystem() {
            const response = await fetch('http://localhost:3000/users');
            const users = await response.json();
            const tbody = document.getElementById('adminUsersTable');
            tbody.innerHTML = '';

            users.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>#${user.id}</td>
                    <td><span style="color:white; font-weight:bold;" id="txt-name-${user.id}">${user.name}</span></td>
                    <td><span id="txt-email-${user.id}">${user.email}</span></td>
                    <td><span style="color: ${user.role === 'admin' ? '#f56565' : user.role === 'professor' ? '#f6e05e' : '#9f7aea'}">[${user.role.toUpperCase()}]</span></td>
                    <td>
                        <button class="btn-small edit-btn" onclick="editUserSystem(${user.id})">EDITAR</button>
                        <button class="btn-small delete-btn" onclick="deleteUserSystem(${user.id}, '${user.name}')">DELETAR</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Cadastro Global via Admin (Trata erro de e-mail duplicado vindo da API)
        document.getElementById('adminRegisterForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            const response = await fetch('http://localhost:3000/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password, role })
            });

            if (response.ok) {
                alert('Nova conta inserida com sucesso!');
                document.getElementById('adminRegisterForm').reset();
                loadAllUsersSystem();
            } else {
                const err = await response.json();
                alert(`Erro: ${err.error}`); // Exibe o aviso amigável de e-mail duplicado
            }
        });

        // Edição Global via Admin
        async function editUserSystem(id) {
            const currentName = document.getElementById(`txt-name-${id}`).textContent;
            const currentEmail = document.getElementById(`txt-email-${id}`).textContent;

            const newName = prompt("Alterar nome:", currentName);
            if (!newName) return;
            const newEmail = prompt("Alterar e-mail:", currentEmail);
            if (!newEmail) return;

            const response = await fetch(`http://localhost:3000/users/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: newName, email: newEmail })
            });

            if (response.ok) {
                alert('Registro alterado!');
                loadAllUsersSystem();
            } else {
                const err = await response.json();
                alert(`Erro: ${err.error}`);
            }
        }

        // Deleção Global via Admin
        async function deleteUserSystem(id, name) {
            if (confirm(`Deseja remover permanentemente o usuário "${name}" (ID #${id}) do sistema?`)) {
                const response = await fetch(`http://localhost:3000/users/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    alert('Usuário removido da base de dados.');
                    loadAllUsersSystem();
                }
            }
        }

        loadAllUsersSystem();
    </script>
</body>
</html>
