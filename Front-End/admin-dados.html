<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Auditoria Geral do Banco</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background: #1a202c; color: #a0aec0; padding: 30px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #4a5568; padding-bottom: 15px; margin-bottom: 30px; }
        h1 { color: #ecc94b; font-size: 24px; }
        .grid-tables { display: grid; grid-template-columns: 1fr; gap: 30px; }
        .container { background: #2d3748; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        h2 { color: #63b3ed; font-size: 18px; margin-bottom: 15px; border-left: 4px solid #63b3ed; padding-left: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #232d3f; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #4a5568; }
        th { background: #4a5568; color: white; }
        .delete-btn { background: #e53e3e; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-family: monospace; font-weight: bold; }
        .delete-btn:hover { background: #c53030; }
        .nav-link { background: #4a5568; color: white; text-decoration: none; padding: 10px 15px; border-radius: 6px; font-size: 14px; font-weight: bold; }
        .nav-link:hover { background: #718096; }
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>🖥️ MASTER_ROOT_ADMIN // Auditoria de Dados</h1>
        <a href="login.html" class="nav-link"><- Voltar para o Portal</a>
    </div>

    <div class="grid-tables">
        <!-- SEÇÃO 1: TODAS AS CONTAS DO BANCO -->
        <div class="container">
            <h2>TABELA: [users] (Professores e Alunos)</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome do Usuário</th>
                        <th>E-mail de Acesso</th>
                        <th>Nível (Role)</th>
                        <th>Ação Crítica</th>
                    </tr>
                </thead>
                <tbody id="adminUsersTable">
                    <!-- Inserido dinamicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Função para carregar as contas cadastradas do banco
        async function loadAllUsersSystem() {
            try {
                const response = await fetch('http://localhost:3000/users');
                const users = await response.json();
                const tbody = document.getElementById('adminUsersTable');
                tbody.innerHTML = '';

                users.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>#${user.id}</td>
                        <td><span style="color:white; font-weight:bold;">${user.name}</span></td>
                        <td>${user.email}</td>
                        <td><span style="color: ${user.role === 'professor' ? '#f6e05e' : '#9f7aea'}">[${user.role.toUpperCase()}]</span></td>
                        <td><button class="delete-btn" onclick="deleteUserSystem(${user.id}, '${user.name}')">DROP_USER</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Erro na carga de dados admin:", err);
            }
        }

        // Função do Administrador para deletar qualquer conta do sistema
        async function deleteUserSystem(id, name) {
            if (confirm(`⚠️ ALERTA ADMIN: Executar comando DELETE para remover permanentemente "${name}" (ID #${id})?`)) {
                const response = await fetch(`http://localhost:3000/users/${id}`, { method: 'DELETE' });
                if (response.ok) { 
                    alert("Comando SQL executado. Registro deletado com sucesso.");
                    loadAllUsersSystem(); 
                } else { 
                    alert("Erro ao executar comando de deleção."); 
                }
            }
        }

        // Executa a carga inicial ao abrir a página
        loadAllUsersSystem();
    </script>
</body>
</html>
