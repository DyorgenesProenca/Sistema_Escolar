<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Escolar - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #4a5568; margin-bottom: 10px; font-size: 28px; }
        p { color: #718096; margin-bottom: 30px; font-size: 14px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; color: #4a5568; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: #667eea; outline: none; box-shadow: 0 0 0 3px rgba(102,126,234,0.2); }
        button { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #5a67d8; transform: translateY(-1px); }
        .error { color: #e53e3e; margin-top: 15px; font-size: 14px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>📐 Delta Math</h1>
        <p>Acesse o portal de matemática</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="exemplo@escola.com" required>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Entrar no Portal</button>
            <div class="error" id="errorMessage"></div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            try {
                const response = await fetch('http://localhost:3000/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Armazena temporariamente os dados do usuário logado no navegador
                    localStorage.setItem('loggedUser', JSON.stringify(data.user));
                    
                    // Redireciona baseado no nível de acesso (role)
                    if (data.user.role === 'professor') {
                        window.location.href = 'professor.html';
                    } else {
                        window.location.href = 'aluno.html';
                    }
                } else {
                    errorDiv.textContent = data.error;
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Erro ao conectar com o servidor.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
